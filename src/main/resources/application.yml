spring:
  application:
    name: seatbooking
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb2
    username: postgres
    password: Password123@
    driver-class-name: org.postgresql.Driver

    # Connection Pool settings (HikariCP defaults)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

# Enable this if you want to see your raw SQL queries printed in the console logs
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"