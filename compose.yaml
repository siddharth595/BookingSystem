services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatbooking
      POSTGRES_USER: seatbooking
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbooking -d seatbooking"]
      interval: 5s
      retries: 10
    volumes:
      - booking_db:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/seatbooking
      DATABASE_USER: seatbooking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      USER_USERNAME: ${USER_USERNAME:-demo_user}
      USER_PASSWORD: ${USER_PASSWORD:?Set USER_PASSWORD}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  booking_db:
